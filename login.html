<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#ffffff">
<title>DNS Agriculture Exchange | Sign in</title>
<style>
:root{--navy:#142c43;--green:#28734f;--line:#dfe6e2;--muted:#64736c;--bg:#f6f8f7}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:var(--bg);color:#17251e;font:15px/1.5 Inter,system-ui,-apple-system,Segoe UI,Arial,sans-serif;display:grid;place-items:center;padding:22px}
main{width:min(100%,440px);background:#fff;border:1px solid var(--line);border-radius:18px;padding:30px;box-shadow:0 12px 40px #142c4310}
.brand{font-size:13px;font-weight:800;letter-spacing:.08em;color:var(--navy);margin-bottom:25px}
h1{font-size:27px;line-height:1.2;margin:0 0 8px;color:var(--navy)}.sub{color:var(--muted);margin:0 0 22px;font-size:14px}
.roles{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:22px}.role{border:1px solid var(--line);border-radius:10px;padding:11px;background:white;color:#42534a;font-weight:650;cursor:pointer}.role.active{border-color:var(--green);background:#f0f7f2;color:var(--green)}
.tabs{display:flex;border-bottom:1px solid var(--line);gap:20px;margin-bottom:20px}.tab{border:0;background:none;padding:0 0 11px;color:#748078;font-weight:700;cursor:pointer;border-bottom:2px solid transparent}.tab.active{color:var(--green);border-color:var(--green)}
label{display:block;font-size:12px;font-weight:700;color:#46564d;margin:13px 0 6px}input{width:100%;height:46px;border:1px solid #d9e1dc;border-radius:9px;padding:0 12px;font:inherit;outline:none}input:focus{border-color:var(--green);box-shadow:0 0 0 3px #28734f16}
.primary,.google{width:100%;height:47px;border-radius:9px;font-weight:750;cursor:pointer;margin-top:15px}.primary{border:0;background:var(--navy);color:white}.primary:disabled{opacity:.55;cursor:wait}.google{background:white;border:1px solid #d9e1dc;color:#25342c;display:flex;align-items:center;justify-content:center;gap:10px;margin-top:12px}.gmark{font-weight:900;font-size:18px;color:#4285f4}
.or{display:flex;align-items:center;gap:12px;color:#87938c;font-size:11px;margin:18px 0}.or:before,.or:after{content:"";height:1px;background:var(--line);flex:1}
.note{font-size:12px;color:#78857d;margin:18px 0 0;text-align:center}.message{display:none;margin-top:14px;padding:11px 12px;border-radius:8px;background:#eff6f1;color:#286044;font-size:13px}.message.error{background:#fff1ef;color:#a13e32}.hidden{display:none!important}.forgot{display:block;text-align:right;font-size:12px;color:var(--green);margin-top:9px;text-decoration:none}.footer{font-size:11px;color:#849087;text-align:center;margin-top:22px}
@media(max-width:420px){main{padding:23px 19px;border-radius:14px}h1{font-size:24px}}
</style>
</head>
<body>
<main>
  <div class="brand">DIGITALNEWSSPACE · AGRICULTURE EXCHANGE</div>
  <h1 id="heading">Welcome back</h1>
  <p class="sub" id="intro">Sign in to your buyer or supplier account.</p>
  <div class="roles" aria-label="Account type">
    <button class="role active" type="button" data-role="buyer">Buyer</button>
    <button class="role" type="button" data-role="supplier">Farmer / Supplier</button>
  </div>
  <div class="tabs">
    <button class="tab active" type="button" data-mode="signin">Log in</button>
    <button class="tab" type="button" data-mode="signup">Create account</button>
  </div>
  <form id="authForm">
    <div id="nameWrap" class="hidden"><label for="fullName">Full name</label><input id="fullName" autocomplete="name" placeholder="Your full name"></div>
    <label for="email">Gmail or email address</label>
    <input id="email" type="email" autocomplete="email" placeholder="you@gmail.com" required>
    <label for="password">Password</label>
    <input id="password" type="password" autocomplete="current-password" placeholder="At least 8 characters" minlength="8" required>
    <a class="forgot" href="#" id="forgot">Forgot password?</a>
    <button class="primary" id="submit" type="submit">Log in</button>
  </form>
  <div class="or">OR</div>
  <button class="google" id="google" type="button"><span class="gmark">G</span><span>Continue with Google</span></button>
  <div class="message" id="message" role="status"></div>
  <p class="note">Your contact details remain private. DNS controls buyer–supplier introductions.</p>
  <div class="footer">By continuing, you agree to the DNS Agriculture Exchange terms and privacy policy.</div>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
/* Add the DNS Supabase project URL and public anon key here after backend setup.
   Never place a Supabase service-role key in this file. */
const SUPABASE_URL = "https://zwvtxybqvxtnjrhfcptt.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_-UriFEnpHEPASlRYfIrZgA_6GD6diPF";
const configured = SUPABASE_URL.startsWith("https://") && !SUPABASE_URL.includes("YOUR_") && !SUPABASE_ANON_KEY.includes("YOUR_");
const client = configured && window.supabase ? window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY) : null;
let role = "buyer", mode = "signin", recoveryMode = new URLSearchParams(location.search).get("recovery")==="1";
const $ = id => document.getElementById(id);
function say(text,error=false){$("message").textContent=text;$("message").classList.toggle("error",error);$("message").style.display="block"}
function setMode(next){mode=next;document.querySelectorAll("[data-mode]").forEach(b=>b.classList.toggle("active",b.dataset.mode===mode));$("nameWrap").classList.toggle("hidden",mode!=="signup");$("fullName").required=mode==="signup";$("forgot").classList.toggle("hidden",mode!=="signin");$("heading").textContent=mode==="signin"?"Welcome back":"Create your account";$("intro").textContent=mode==="signin"?"Sign in to your buyer or supplier account.":"Register securely to access the exchange."; $("submit").textContent=mode==="signin"?"Log in":"Create account";$("password").autocomplete=mode==="signin"?"current-password":"new-password";$("message").style.display="none"}
document.querySelectorAll("[data-mode]").forEach(b=>b.addEventListener("click",()=>setMode(b.dataset.mode)));
document.querySelectorAll("[data-role]").forEach(b=>b.addEventListener("click",()=>{role=b.dataset.role;document.querySelectorAll("[data-role]").forEach(x=>x.classList.toggle("active",x===b));$("intro").textContent=(mode==="signin"?"Sign in to your ":"Create your ")+(role==="buyer"?"buyer":"supplier")+" account."}));
if(recoveryMode){setMode("signin");$("heading").textContent="Choose a new password";$("intro").textContent="Enter and save your new password.";$("password").autocomplete="new-password";$("submit").textContent="Update password";$("forgot").classList.add("hidden")}
client?.auth.onAuthStateChange(async(event)=>{if(event==="PASSWORD_RECOVERY"){recoveryMode=true;$("heading").textContent="Choose a new password";$("intro").textContent="Enter and save your new password.";$("submit").textContent="Update password";$("forgot").classList.add("hidden")}});
$("authForm").addEventListener("submit",async e=>{e.preventDefault();if(!client){say("Preview only: connect this page to your Supabase project to activate secure email sign-up and login.",true);return}
const email=$("email").value.trim(),password=$("password").value,button=$("submit");button.disabled=true;
try{let result;if(recoveryMode){result=await client.auth.updateUser({password});if(!result.error){say("Password updated. You can now sign in.");recoveryMode=false;history.replaceState({},"",location.pathname);setMode("signin");$("password").value=""}}else if(mode==="signup"){result=await client.auth.signUp({email,password,options:{emailRedirectTo:window.location.origin+window.location.pathname,data:{full_name:$("fullName").value.trim(),account_type:role}}});if(!result.error)say("Account request received. Check your email to confirm your address.")}else{result=await client.auth.signInWithPassword({email,password});if(!result.error){const {data:profile}=await client.from("exchange_profiles").select("account_type").eq("user_id",result.data.user.id).maybeSingle();window.location.href=(profile?.account_type==="supplier"?"index.html":"buyer.html")}}if(result.error)say(result.error.message,true)}catch(err){say("Unable to complete sign-in. Please try again.",true)}finally{button.disabled=false}});
$("google").addEventListener("click",()=>say("Google sign-in is not enabled yet. Use email and password so DNS can save the correct buyer or supplier account type.",true));
$("forgot").addEventListener("click",async e=>{e.preventDefault();const email=$("email").value.trim();if(!email)return say("Enter your email address first.",true);if(!client)return say("Preview only: connect Supabase Auth to enable password recovery.",true);const {error}=await client.auth.resetPasswordForEmail(email,{redirectTo:window.location.origin+window.location.pathname+"?recovery=1"});say(error?error.message:"If this email is registered, a password reset link will be sent.",!!error)});
</script>
</body>
</html>
